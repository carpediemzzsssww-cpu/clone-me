<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site twin demo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #222;
      font-family: -apple-system, "PingFang SC", sans-serif; padding: 16px; }
    main { max-width: 520px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>Your site</h1>
    <p>Bottom-right is your AI twin. Replace the data-* values below, put your public prompt in <code>api/_prompt.js</code>, set the env vars on your host.</p>
  </main>
  <script src="twin-widget.js" defer
    data-name="Mira"
    data-avatar="M"
    data-questions="你最近在做什么？|讲讲你最喜欢的作品|怎么联系你本人？"
    data-contact="mailto:hello@example.com"
    data-endpoint="/api/chat"
    data-lang="zh"></script>
</body>
</html>
